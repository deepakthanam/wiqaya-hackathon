  - {year: 2025, start: "2025-03-01", end: "2025-03-29", status: verified,
     source_url: "https://gulftoday.ae/news/2025/02/28/crescent-moon-sighted-in-uae-holy-month-to-begin-on-march-1",
     rules: {no_daytime_appointments_for_fasting_adults: true, preferred_appointment_window: ["19:30", "23:00"],
             send_after_iftar: true}}
  # 1 Ramadan 1447 = Wed 18 Feb 2026; Presidential Court: Thu 19 Mar completes Ramadan, Eid Fri 20 Mar.
  - {year: 2026, start: "2026-02-18", end: "2026-03-19", status: verified,
     source_url: "https://www.wam.ae/en/article/bysbidd-breaking-wednesday-first-day-ramadan-uae",
