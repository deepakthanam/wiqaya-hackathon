# Wiqaya calendar and cultural-timing rules (PROMPT.md §5.3). Covers 2024-11-01 -> 2027-12-31
# (24-month history period before T0 = 2026-11-01, the 12-week evaluation period, and Ramadan 2027).
# Compiled 2026-11-07.
#
# status values:
#   verified              - date confirmed by an official announcement (UAE Presidential Court / FAHR / MoHRE
#                           as reported by WAM, Aletihad or national press) or fixed by Cabinet Resolution
#                           No. 27 of 2024 (Gregorian-dated holidays). For past dates this is what was observed.
#   estimated             - Hijri-dependent future date: from astronomical forecasts or arithmetic
#                           (one lunar year ~ 354 days after the verified 2026 date). Can move +/- 1 day after
#                           moon sighting, and non-Eid holidays may be transferred by the Cabinet to the start or
#                           end of the week. Re-check before use.
#   astronomical_estimate - Ramadan start/end from astronomers' forecasts; official start depends on sighting.
#   placeholder           - invented for the prototype; NOT a real calendar. Replace with ADEK / school data.
#   observance            - marked day that is not a day off under the current official holiday list.
#
# Holiday dates follow the private-sector announcement (MoHRE) where federal (FAHR) and private differ;
# where they differ, the note says so and no_send_periods use the wider window.
timezone: Asia/Dubai
quiet_hours: {start: "21:00", end: "08:00"}
# Verified: u.ae "Working hours in the public sector" - federal government works Mon-Thu 07:30-15:30 and
# Fri 07:30-12:00; Saturday and Sunday are the official weekend (effective 2022-01-01). Abu Dhabi Government
# uses the same system. Private-sector employers are not obliged to follow it (many work Mon-Fri).
weekend: [saturday, sunday]
weekend_source_url: "https://u.ae/en/information-and-services/jobs/Sector-of-employment/working-in-uae-government-sector/working-hours-in-the-public-sector"
friday_half_day_government: {end: "12:00"}
friday_midday_no_send: {start: "11:30", end: "14:00"}   # Friday (Jumu'ah) prayer window - product rule

