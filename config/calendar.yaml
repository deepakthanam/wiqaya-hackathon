  - {date: "2024-12-03", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://www.arabianbusiness.com/culture-society/eid-al-etihad-uae-declares-two-day-private-sector-holiday-for-national-day-2024"}
  # --- 2025 ---
  - {date: "2025-01-01", name: "New Year's Day", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  - {date: "2025-06-27", name: "Hijri New Year 1447", status: verified,
     source_url: "https://gulfnews.com/uae/government/hijri-new-year-2025-uae-announces-islamic-new-year-holiday-for-private-sector-1.500165428"}
  - {date: "2025-09-05", name: "Prophet Mohammed's Birthday", status: verified,
     source_url: "https://www.khaleejtimes.com/uae/public-holiday-government-employees-prophets-birthday-2025"}
  - {date: "2025-12-02", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  - {date: "2025-12-03", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  # --- 2026 ---
  - {date: "2026-01-01", name: "New Year's Day", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  # 1 Muharram 1448 fell on Tue 16 Jun; the UAE holiday was set for Mon 15 Jun (FAHR/MoHRE, 3 Jun 2026).
  - {date: "2026-06-15", name: "Hijri New Year 1448", status: verified,
     source_url: "https://en.aletihad.ae/news/uae/4670030/uae-announces-hijri-new-year-holiday-on-june-15"}
  # 12 Rabi' al-Awwal 1448 = Tue 25 Aug; holiday transferred to Fri 28 Aug (FAHR Circular No. 11 of 2026).
  - {date: "2026-08-28", name: "Prophet Mohammed's Birthday (transferred)", status: verified,
     source_url: "https://www.thenationalnews.com/news/uae/2026/08/14/prophet-mohammeds-birthday-confirmed-after-rabea-al-awwal-moon-spotted/"}
  - {date: "2026-12-02", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  - {date: "2026-12-03", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  # --- 2027 ---
  - {date: "2027-01-01", name: "New Year's Day", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  # Arithmetic estimate (1448 + ~354 days); 5/6 Jun 2027 is a weekend, so likely no weekday off.
  - {date: "2027-06-06", name: "Hijri New Year 1449", status: estimated, method: "1448 date + 354 days",
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  # Arithmetic estimate (1448 + ~354 days); 14/15 Aug 2027 is a weekend. Cabinet may transfer.
  - {date: "2027-08-15", name: "Prophet Mohammed's Birthday", status: estimated, method: "1448 date + 354 days",
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  - {date: "2027-12-02", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}
  - {date: "2027-12-03", name: "National Day (Eid Al Etihad)", status: verified,
     source_url: "https://u.ae/en/information-and-services/public-holidays-and-religious-affairs/public-holidays"}

# Commemoration Day (30 Nov) is NOT on the current official holiday list (u.ae public-holidays page,
# updated 29 Oct 2026; Cabinet Resolution No. 27 of 2024). Treated as an observance: sends allowed,
# but message templates may avoid celebratory tone.
observances:
  - {date: "2024-11-30", name: "Commemoration Day", status: observance}
  - {date: "2025-11-30", name: "Commemoration Day", status: observance}
  - {date: "2026-11-30", name: "Commemoration Day", status: observance}
  - {date: "2027-11-30", name: "Commemoration Day", status: observance}

