  retrieved_on: "2026-11-07"
  licence: "US Government work – public domain"
  verified: true
  key_facts:
    - "Final Recommendation Statement, June 18, 2024 (Grade B)"
    - "Clinicians provide or refer children and adolescents 6 years or older with a high BMI (≥95th percentile for age and sex) to comprehensive, intensive behavioral interventions"
    - "Intensive = 26 or more contact hours"
  notes: >-
    Supporting CDC definition page (verified via WebFetch; curl got 403):
    https://www.cdc.gov/bmi/child-teen-calculator/bmi-categories.html: ages 2 through 19; obesity = ≥95th percentile;
