# Guideline source verification for Wiqaya rules.
# Retrieved 2026-11-07. Each entry was fetched by curl, WebFetch, PubMed E-utilities or an
# archived copy (Wayback Machine), as stated in `notes`. key_facts give the source's own
# wording (quoted or closely paraphrased). They are NOT clinical validation of the encoding.
# verified: true  -> page fetched and the key_facts were read on it (or on the named mirror).
# verified: false -> the page could not be fetched; facts are unconfirmed.

- rule_id: WCV_SCHEDULE
  name: "Bright Futures/AAP – Recommendations for Preventive Pediatric Health Care (Periodicity Schedule)"
  publisher: American Academy of Pediatrics / Bright Futures
  year: 2025
  url: https://downloads.aap.org/AAP/PDF/periodicity_schedule.pdf
  final_url: https://downloads.aap.org/AAP/PDF/periodicity_schedule.pdf
  http_status: 200
  retrieved_on: "2026-11-07"
  licence: "© 2025 American Academy of Pediatrics; cited, not reproduced"
  verified: true
  key_facts:
    - "Copyright © 2025 by the American Academy of Pediatrics, updated February 2025"
    - "Age columns: Prenatal, Newborn, 3-5 d, By 1 mo, 2 mo, 4 mo, 6 mo, 9 mo, 12 mo, 15 mo, 18 mo, 24 mo, 30 mo, 3 y, 4 y ... yearly to 21 y"
    - "The Bright Futures/American Academy of Pediatrics Recommendations for Preventive Pediatric Health Care are updated annually"
    - "This schedule reflects recommendations approved in December 2024"
  notes: >-
    PDF text was extracted with pdftotext. Landing page
    https://www.aap.org/en/practice-management/care-delivery-approaches/periodicity-schedule/ (200; WebFetch shows
    "Last updated 02/06/2025"). The brief's list (newborn, 1, 2, 4, 6, 9, 12, 15, 18, 24, 30 months, then yearly)
    matches the column headers. AAP also lists a 3-5 day visit and a prenatal visit, which the brief leaves out.
    The schedule is configurable; replace it with the DOH WCV schedule.

