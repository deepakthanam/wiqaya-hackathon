- rule_id: FOLLOWUP_PREDIABETES
  name: "ADA – 2. Diagnosis and Classification of Diabetes: Standards of Care in Diabetes—2026"
  publisher: American Diabetes Association (Diabetes Care 2026;49(Suppl 1):S27–S49)
  year: 2026
  url: https://doi.org/10.2337/dc26-S002
  final_url: https://diabetesjournals.org/care/article/49/Supplement_1/S27/163926/2-Diagnosis-and-Classification-of-Diabetes
  http_status: 403
  retrieved_on: "2026-11-07"
  licence: "© American Diabetes Association; cited, not reproduced"
  verified: true
  key_facts:
    - "Table 2.2 criteria defining prediabetes: A1C 5.7–6.4% (39–47 mmol/mol)"
    - "Table 2.5 footnote: 'People with prediabetes (A1C ≥5.7% [≥39 mmol/mol], IGT, or IFG) should be tested yearly.'"
    - "Rec 2.12c: for normal results, repeat screening at a minimum of 3-year intervals is reasonable"
  notes: >-
    The DOI resolves to diabetesjournals.org, which returns 403 to automated clients. Content was read from the PMC copy
    https://pmc.ncbi.nlm.nih.gov/articles/PMC12690183/ (WebFetch 200). The phrase "at least annually" was NOT found;
    the source says "tested yearly". Supporting CDC page (WebFetch 200, curl 403):
    https://www.cdc.gov/diabetes/diabetes-testing/prediabetes-a1c-test.html says "Prediabetes: 5.7% to 6.4%" and
    "They'll likely recommend you repeat your A1C every 1 to 2 years" (updated May 15, 2024). USPSTF 2021 (above)
    also states 5.7–6.4% is consistent with prediabetes.

- rule_id: FOLLOWUP_BP_ELEVATED
  name: "USPSTF – Hypertension in Adults: Screening (out-of-office confirmation)"
  publisher: USPSTF
  year: 2021
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/hypertension-in-adults-screening
  final_url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/hypertension-in-adults-screening
  http_status: 200
  retrieved_on: "2026-11-07"
  licence: "US Government work – public domain"
  verified: true
  key_facts:
    - "Obtain BP measurements outside the clinical setting (ABPM or HBPM) for diagnostic confirmation before starting treatment"
    - "Thresholds used by various organizations to define hypertension range from ≥130/80 mm Hg to ≥140/90 mm Hg"
    - "Evidence compared OBPM 140/90 with reference 24-h ABPM 130/80 or daytime ABPM 135/85"
    - "Persons with high-normal BP are at increased risk: annual screening is a reasonable option"
  notes: >-
    The 2025 AHA/ACC et al. Guideline for the Prevention, Detection, Evaluation and Management of High Blood Pressure
    in Adults (Hypertension 2025;82(10):e212–e316, DOI 10.1161/HYP.0000000000000249, PMID 40811516) replaces the
    2017 ACC/AHA guideline. Its existence was verified via PubMed; ahajournals.org full text returned 403. The PMC
    commentary (PMC12425457, Hypertension 2025;82(10):1538–1540) states "BP categories remain the same as in 2017",
    stage 1 = 130–139/80–89, stage 2 ≥140/90, and that drug therapy is recommended for low-risk stage 1 when BP
    stays ≥130/80 after 3–6 months of lifestyle change. The numeric 'elevated' range (120–129/<80) was NOT read on
    a primary page. The recheck window in the rule is configurable and is a local ASSUMPTION.

- rule_id: CASCADE_FH
  name: "NICE CG71 – Familial hypercholesterolaemia: identification and management"
  publisher: NICE
  year: 2008
  url: https://www.nice.org.uk/guidance/cg71/chapter/Recommendations
  final_url: http://web.archive.org/web/20261010100045/https://www.nice.org.uk/guidance/cg71/chapter/Recommendations
  http_status: 200
  retrieved_on: "2026-11-07"
  licence: "© NICE; cited, not reproduced"
  verified: true
  key_facts:
    - "Published 27 August 2008; last updated 04 October 2019 (per archived page header)"
    - "1.2.1 Carry out cascade testing using DNA testing to identify affected first- and second- and, when possible, third-degree biological relatives of people with a genetic diagnosis of FH. [2017]"
    - "1.2.2 Offer all people with FH a referral to a specialist with expertise in FH for confirmation of diagnosis and initiation of cascade testing. [2008]"
    - "1.2.4 Healthcare professionals should be aware of the latest guidance on data protection when undertaking cascade testing. [2008]"
    - "1.1.15 In children aged 0 to 10 years at risk of FH because of 1 affected parent, offer a DNA test at the earliest opportunity. If testing of a child at risk has not been undertaken by the age of 10 years, offer an additional opportunity for a DNA test. [2017]"
    - "1.1.16 Children at risk of homozygous FH (2 affected parents or clinical signs e.g. xanthomata): measure LDL-C before the age of 5 years or at the earliest opportunity thereafter; LDL-C >11 mmol/l -> consider homozygous FH. [2008]"
    - "1.3.1.20 Offer statins to children with FH by the age of 10 years or at the earliest opportunity thereafter. [2017]"
  notes: >-
    nice.org.uk returns 403 to curl and WebFetch (bot protection, not bypassed). The text was read from the Internet
    Archive snapshot dated 2026-10-10. A search result says NICE plans to update the case-finding and diagnosis
    recommendations; re-check before go-live. NICE QS41 statement 5 (cascade testing) is related but was not fetched (403).

