- rule_id: CERVICAL_SCREEN
  name: "USPSTF – Cervical Cancer: Screening"
  publisher: USPSTF
  year: 2018
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cervical-cancer-screening
  final_url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cervical-cancer-screening
  http_status: 200
  retrieved_on: "2026-11-07"
  licence: "US Government work – public domain"
  verified: true
  key_facts:
    - "Final Recommendation Statement, August 21, 2018 (still the final statement on the canonical page as of 2026-11-07)"
    - "Women aged 21 to 29: cervical cytology alone every 3 years (Grade A)"
    - "Women aged 30 to 65: cytology alone every 3 years, OR hrHPV testing alone every 5 years, OR hrHPV + cytology cotesting every 5 years (Grade A)"
    - "Recommends against screening women younger than 21 (Grade D)"
    - "Recommends against screening after hysterectomy with removal of the cervix and no history of CIN 2/3 or cervical cancer (Grade D)"
    - "Recommends against screening women older than 65 with adequate prior screening who are not otherwise at high risk (Grade D)"
  notes: >-
    A draft update exists at
    https://www.uspreventiveservicestaskforce.org/uspstf/draft-recommendation/cervical-cancer-screening-adults-adolescents
    (200). Secondary sources describe it as the December 2024 draft: cytology every 3 years at 21–29; primary hrHPV
    (clinician- or self-collected) every 5 years at 30–65 as the preferred strategy. It was NOT shown as final on the
    canonical page, so encode the 2018 final statement.

