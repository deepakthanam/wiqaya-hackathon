# Code verification for Wiqaya. Retrieved 2026-11-07.
# Primary evidence: tx.fhir.org R4 CodeSystem/$lookup (Accept: application/fhir+json). A Parameters
# response with a `display` counts as verified. Displays below are as returned. Server versions:
# LOINC 2.83, SNOMED CT International 20250201, v3-RoleCode 4.0.0, consentscope 2.0.1, CVX 20250715.
# evidence_url template: https://tx.fhir.org/r4/CodeSystem/$lookup?system=<system>&code=<code>
# verified: false -> no candidate code was confirmed; use a local code.

