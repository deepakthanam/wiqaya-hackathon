consent:
  scope:
    system: http://terminology.hl7.org/CodeSystem/consentscope
    evidence_url: https://hl7.org/fhir/R4/valueset-consent-scope.html
    codes:
      - {code: patient-privacy, display: "Privacy Consent", verified: true}
      - {code: treatment, display: "Treatment", verified: true}
      - {code: research, display: "Research", verified: true}
      - {code: adr, display: "Advanced Care Directive", verified: true}
  category:
    evidence_url: https://hl7.org/fhir/R4/valueset-consent-category.html
    codes:
      - {system: http://loinc.org, code: "59284-0", display: "Consent Document", verified: true}
    note: >-
      The R4 consent-category value set page also contains LOINC 57016-8 and 64292-6, codes from consentcategorycodes
      (e.g. acd, npp) and v3-ActCode. Only 59284-0 was looked up individually. Consent.scope, Consent.category,
      Consent.patient, Consent.status, Consent.policyRule and Consent.provision were all confirmed on
      https://hl7.org/fhir/R4/consent.html.

