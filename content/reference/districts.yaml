# District centroids for the Wiqaya synthetic population (see PROMPT.md §4).
# Each centroid is the lat/lon Nominatim returned for the named OSM object (looked up 2026-11-07,
# https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=ae&q=...).
# name_ar is the OSM name:ar tag of the same object (Arabic diacritics removed where OSM had them).
# Centroids are approximate and only used to place synthetic households and clinics.
attribution: "Centroids from OpenStreetMap Nominatim. © OpenStreetMap contributors, ODbL 1.0"
retrieved_on: "2026-11-07"
districts:
  - id: abu_dhabi_island
    name: Abu Dhabi Island
    name_ar: جزيرة أبو ظبي
    region: abu_dhabi
    lat: 24.4688
    lon: 54.3710
    # The island relation centroid sits mid-island (around the Al Nahyan / Al Manhal area), a sensible
    # central point for the dense downtown grid. The city relation/4479763 point (24.4538, 54.3774) is
    # an alternative; we use the island object because the district is "the island".
    centroid_source: "OSM Nominatim relation/13027505 'Abu Dhabi Island' (place=island)"
    verified: true
