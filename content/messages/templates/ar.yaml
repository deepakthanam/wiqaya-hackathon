    دوريا مستحقا. التطعيمات تحمي الأطفال. حجزنا لكم هذه المواعيد: {slot_options}. إذا كنتم تعتقدون أن
    سجلنا غير محدّث، يرجى إخبارنا. أرسلوا 1 للحجز، أو 2 لوقت آخر، أو 3 إذا كنتم لا ترغبون في تلقي هذه
    التذكيرات.
  english_gloss: >-
    Hello {recipient_first_name}, {clinic_name} with you. Our records show {child_first_name} has a
    routine vaccine due. Vaccines protect children. We kept these times for you: {slot_options}. If
    you think our record is not up to date, please tell us. Send 1 to book, 2 for another time, or 3
    if you do not wish to receive these reminders.
- id: IMM_PARENT_SMS
  pathway: immunisation
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: لدى {child_first_name} تطعيم دوري مستحق. موعد متاح: {slot_short}. رد 1=حجز 2=وقت
    آخر 3=STOP
  english_gloss: >-
    {clinic_short}: {child_first_name} has a routine vaccine due. Available time: {slot_short}.
    Reply 1=book 2=other time 3=STOP
- id: IMM_PARENT_CALL
  pathway: immunisation
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "أخبروني وسنتوقف عن هذه الاتصالات"
  text: >-
    مرحبا، هل يمكنني التحدث مع {recipient_first_name}؟ أنا {caller_name} من {clinic_name}. تُظهر
    سجلاتنا أن لدى {child_first_name} تطعيما دوريا مستحقا. إذا أُعطي التطعيم في مكان آخر، يرجى إخبارنا
    لنحدّث السجل. لدينا هذه المواعيد: {slot_options}. أي موعد يناسبكم؟ إذا كنتم لا ترغبون في تلقي هذه
    التذكيرات، أخبروني وسنتوقف عن هذه الاتصالات.
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? I am {caller_name} from {clinic_name}. Our
    records show {child_first_name} has a routine vaccine due. If the vaccine was given somewhere
    else, please tell us so we can update the record. We have these times: {slot_options}. Which
    suits you? If you do not wish to receive these reminders, tell me and we will stop these calls.
- id: IMM_PARENT_CHW
  pathway: immunisation
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "لا تكرر السؤال مرة أخرى"
  text: >-
    رحّب بـ{recipient_first_name} وعرّف بنفسك من {clinic_name}. اشرح أن لدى {child_first_name} تطعيما
    دوريا مستحقا. اطلب الاطلاع على بطاقة التطعيم إن وُجدت، وسجّل أي تطعيمات أُعطيت في مكان آخر. اعرض
    هذه المواعيد: {slot_options}. إذا فضّلوا عدم المشاركة، اشكرهم وسجّل "رفض" ولا تكرر السؤال مرة
    أخرى.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Explain that
    {child_first_name} has a routine vaccine due. Ask to see the vaccine card if there is one, and
    note any vaccines given elsewhere. Offer these times: {slot_options}. If they prefer not to take
    part, thank them, record "declined" and do not ask again.

