# Arabic (Modern Standard Arabic) machine draft of templates/en.yaml. Needs native review.
# Respectful plural address ("أنتم") is used for recipients; CHW scripts address the worker.
# Reply codes (1/2/3, STOP) stay in ASCII so SMS gateways can parse them.
language: ar
review_status: machine_draft
templates:

# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "3 إذا كنتم لا ترغبون في تلقي هذه التذكيرات"
  text: >-
    مرحبا {recipient_first_name}، معكم {clinic_name}. حان موعد الفحص الدوري لـ{child_first_name}
    ({visit_label}). تساعدنا هذه الزيارات على متابعة نمو طفلكم. حجزنا لكم هذه المواعيد:
    {slot_options}. أرسلوا 1 للحجز، أو 2 لوقت آخر، أو 3 إذا كنتم لا ترغبون في تلقي هذه التذكيرات.
  english_gloss: >-
    Hello {recipient_first_name}, {clinic_name} with you. It is time for {child_first_name}'s
    routine check-up ({visit_label}). These visits help us follow your child's growth. We have
    kept these times for you: {slot_options}. Send 1 to book, 2 for another time, or 3 if you do
    not wish to receive these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: حان موعد الفحص الدوري لـ{child_first_name}. موعد متاح: {slot_short}. رد
    1=حجز 2=وقت آخر 3=STOP
  english_gloss: >-
    {clinic_short}: it is time for {child_first_name}'s routine check-up. Available time:
    {slot_short}. Reply 1=book 2=other time 3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "أخبروني وسنتوقف عن هذه الاتصالات"
  text: >-
    مرحبا، هل يمكنني التحدث مع {recipient_first_name}؟ اسمي {caller_name} من {clinic_name}.
    أتصل بكم لأنه حان موعد الفحص الدوري لـ{child_first_name}، وهو {visit_label}. تساعدنا هذه
    الزيارات على متابعة نمو طفلكم وإعطاء التطعيمات المستحقة. لدينا هذه المواعيد: {slot_options}.
    أي موعد يناسبكم؟ وإذا كان يوم آخر أنسب لكم، يمكنني البحث عنه. إذا كنتم لا ترغبون في تلقي هذه
    التذكيرات، أخبروني وسنتوقف عن هذه الاتصالات.
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name} from {clinic_name}.
    I am calling because it is time for {child_first_name}'s routine check-up, the {visit_label}.
    These visits help us follow your child's growth and give due vaccines. We have these times:
    {slot_options}. Which suits you? If another day is better, I can find one. If you do not wish
    to receive these reminders, tell me and we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "لا تكرر السؤال مرة أخرى"
  text: >-
    رحّب بـ{recipient_first_name} وعرّف بنفسك كعامل صحة مجتمعية من {clinic_name}. اشرح أنه حان موعد
    الفحص الدوري لـ{child_first_name} ({visit_label})، وأن هذه الزيارات تتابع النمو وتقدم التطعيمات
    المستحقة. اعرض هذه المواعيد: {slot_options}. ساعد في أسئلة المواصلات. إذا فضّلوا عدم المشاركة،
    اشكرهم وسجّل "رفض" ولا تكرر السؤال مرة أخرى.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself as a community health worker from
    {clinic_name}. Explain that {child_first_name}'s routine check-up ({visit_label}) is due and
    that these visits follow growth and give due vaccines. Offer these times: {slot_options}. Help
    with transport questions. If they prefer not to take part, thank them, record "declined" and
    do not ask again.

# ---------------------------------------------------------------- Developmental check
- id: DEV_PARENT_WHATSAPP
  pathway: developmental
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "3 إذا كنتم لا ترغبون في تلقي هذه التذكيرات"
  text: >-
    مرحبا {recipient_first_name}، معكم {clinic_name}. في عمر {child_first_name}، نقدم لكل طفل فحصا
    قصيرا لطريقة لعبه وكلامه وحركته. ويمكنكم أيضا سؤالنا عن أي شيء يخص نمو طفلكم. حجزنا لكم هذه
    المواعيد: {slot_options}. أرسلوا 1 للحجز، أو 2 لوقت آخر، أو 3 إذا كنتم لا ترغبون في تلقي هذه
    التذكيرات.
  english_gloss: >-
    Hello {recipient_first_name}, {clinic_name} with you. At {child_first_name}'s age, we offer
    every child a short check of how they play, talk and move. You can also ask us anything about
    your child's growth. We kept these times for you: {slot_options}. Send 1 to book, 2 for another
    time, or 3 if you do not wish to receive these reminders.
- id: DEV_PARENT_SMS
  pathway: developmental
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: حان موعد فحص اللعب والنمو لـ{child_first_name}. موعد متاح: {slot_short}. رد
    1=حجز 2=وقت آخر 3=STOP
  english_gloss: >-
    {clinic_short}: it is time for {child_first_name}'s play and growth check. Available time:
    {slot_short}. Reply 1=book 2=other time 3=STOP
- id: DEV_PARENT_CALL
  pathway: developmental
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "أخبروني وسنتوقف عن هذه الاتصالات"
  text: >-
    مرحبا، هل يمكنني التحدث مع {recipient_first_name}؟ أنا {caller_name} من {clinic_name}. نقدم لكل
    طفل في عمر {child_first_name} فحصا قصيرا لطريقة لعبه وكلامه وحركته. يستغرق الفحص نحو 20 دقيقة،
    ويمكنكم طرح أي سؤال على الطبيب. لدينا هذه المواعيد: {slot_options}. أي موعد يناسبكم؟ إذا كنتم لا
    ترغبون في تلقي هذه التذكيرات، أخبروني وسنتوقف عن هذه الاتصالات.
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? I am {caller_name} from {clinic_name}. We offer
    every child of {child_first_name}'s age a short check of how they play, talk and move. It takes
    about 20 minutes, and you can ask the doctor any question. We have these times: {slot_options}.
    Which suits you? If you do not wish to receive these reminders, tell me and we will stop these
    calls.
- id: DEV_PARENT_CHW
  pathway: developmental
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "لا تكرر السؤال مرة أخرى"
  text: >-
    رحّب بـ{recipient_first_name} وعرّف بنفسك من {clinic_name}. اشرح أن كل طفل في عمر
    {child_first_name} يُقدَّم له فحص دوري قصير للعب والكلام والحركة، وأن الوالدين يمكنهم طرح أي
    أسئلة. اعرض هذه المواعيد: {slot_options}. إذا فضّلوا عدم المشاركة، اشكرهم وسجّل "رفض" ولا تكرر
    السؤال مرة أخرى.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Explain that every child
    of {child_first_name}'s age is offered a short routine check of play, talking and movement, and
    that parents can ask any questions. Offer these times: {slot_options}. If they prefer not to
    take part, thank them, record "declined" and do not ask again.

# ---------------------------------------------------------------- Immunisation catch-up
- id: IMM_PARENT_WHATSAPP
  pathway: immunisation
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "3 إذا كنتم لا ترغبون في تلقي هذه التذكيرات"
