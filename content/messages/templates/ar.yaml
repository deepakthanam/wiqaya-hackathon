    رحّب بـ{recipient_first_name} وعرّف بنفسك من {clinic_name}. ادعُ {child_first_name} إلى زيارة
    متابعة دورية للنمو. اجعل الحديث إيجابيا وعن عادات الأسرة كلها، ولا تعلّق على جسم الطفل. اعرض هذه
