    {child_first_name} إلى زيارة متابعة دورية للنمو. سيتحدث الطبيب معكم عن الأكل الصحي والنوم واللعب
    لكل أفراد الأسرة. لدينا هذه المواعيد: {slot_options}. إذا كنتم لا ترغبون في تلقي هذه التذكيرات،
