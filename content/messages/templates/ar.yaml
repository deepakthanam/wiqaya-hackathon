  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Invite
    {child_first_name} to a routine growth follow-up visit. Keep the talk positive and about the
    whole family's habits, and do not comment on the child's body. Offer these times:
    {slot_options}. If they prefer not to take part, thank them, record "declined" and do not ask
    again.

