# ---------------------------------------------------------------- Confirmations
- id: PREF_CONFIRM_WHATSAPP
  pathway: preference_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name]
  decline_text: "أرسلوا STOP"
  text: >-
    شكرا لكم، {recipient_first_name}. حفظنا تفضيلات التواصل الخاصة بكم. يمكنكم تغييرها في أي وقت، أو
    أرسلوا STOP (إيقاف) لإيقاف جميع التذكيرات.
  english_gloss: >-
    Thank you, {recipient_first_name}. We have saved your contact preferences. You can change them
    at any time, or send STOP (stop) to stop all reminders.
- id: PREF_CONFIRM_SMS
  pathway: preference_confirm
  audience: adult
  channel: sms
  slots: [recipient_first_name]
  decline_text: "STOP"
  text: >-
    شكرا {recipient_first_name}. تم حفظ تفضيلات التواصل. رد STOP لإيقاف جميع التذكيرات.
  english_gloss: >-
    Thank you {recipient_first_name}. Contact preferences saved. Reply STOP to stop all reminders.
- id: OPTOUT_CONFIRM_WHATSAPP
  pathway: optout_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, pathway_label]
  decline_text: "أرسلوا STOP"
  text: >-
    شكرا لكم، {recipient_first_name}. لن تصلكم تذكيرات أخرى بشأن {pathway_label}. هذا لا يغير رعايتكم.
    إذا غيرتم رأيكم، أخبروا عيادتكم فقط. لإيقاف جميع التذكيرات، أرسلوا STOP (إيقاف).
  english_gloss: >-
    Thank you, {recipient_first_name}. You will not get more reminders about {pathway_label}. This
    does not change your care. If you change your mind, just tell your clinic. To stop all
    reminders, send STOP (stop).
- id: OPTOUT_CONFIRM_SMS
  pathway: optout_confirm
  audience: adult
  channel: sms
  slots: [pathway_label]
  decline_text: "STOP"
  text: >-
    لن تصلكم تذكيرات أخرى بشأن {pathway_label}. رعايتكم لن تتغير. رد STOP لإيقاف جميع التذكيرات.
  english_gloss: >-
