    Batiin si {recipient_first_name} at magpakilala mula sa {clinic_name}. Ipaliwanag na may regular
    na bakuna si {child_first_name} na nakatakda na. Hilinging makita ang vaccine card kung mayroon
    sila, at itala ang mga bakunang naibigay sa ibang lugar. Ialok ang mga oras na ito:
