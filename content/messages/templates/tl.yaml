# Tagalog/Filipino machine draft of en.yaml. Polite register (po/opo). Needs native review.
language: tl
review_status: machine_draft
templates:

# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "3 kung ayaw na po ninyong makatanggap ng mga paalalang ito"
  text: >-
    Magandang araw po, {recipient_first_name}, ito po ang {clinic_name}. Panahon na po para sa
    regular na check-up ni {child_first_name} ({visit_label}). Tinutulungan kami ng mga pagbisitang
    ito na masubaybayan ang paglaki ng inyong anak. May mga oras po kaming inilaan para sa inyo:
    {slot_options}. Sumagot po ng 1 para mag-book, 2 para sa ibang oras, 3 kung ayaw na po ninyong
    makatanggap ng mga paalalang ito.
  english_gloss: >-
    Good day, {recipient_first_name}, this is {clinic_name}. It is time for {child_first_name}'s
    regular check-up ({visit_label}). These visits help us follow your child's growth. We set aside
    times for you: {slot_options}. Reply 1 to book, 2 for another time, 3 if you no longer want to
    receive these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: Panahon na po ng regular na check-up ni {child_first_name}. Bakanteng oras:
    {slot_short}. Sumagot: 1=book 2=ibang oras 3=STOP
  english_gloss: >-
    {clinic_short}: It is time for {child_first_name}'s regular check-up. Free time: {slot_short}.
    Reply: 1=book 2=other time 3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "sabihin lang po sa akin at ititigil na namin ang mga tawag na ito"
  text: >-
    Magandang araw po, maaari ko po bang makausap si {recipient_first_name}? Ako po si {caller_name}
    mula sa {clinic_name}. Tumatawag po ako dahil panahon na para sa regular na check-up ni
    {child_first_name}, ang {visit_label}. Sa mga pagbisitang ito, nasusubaybayan namin ang paglaki
    ng inyong anak at naibibigay ang mga bakunang nakatakda na. Ito po ang mga bakanteng oras:
    {slot_options}. Alin po ang maginhawa sa inyo? Kung mas mabuti ang ibang araw, hahanap po ako.
    Kung ayaw na po ninyong makatanggap ng mga paalalang ito, sabihin lang po sa akin at ititigil na
    namin ang mga tawag na ito.
  english_gloss: >-
    Good day, may I speak with {recipient_first_name}? I am {caller_name} from {clinic_name}. I am
    calling because it is time for {child_first_name}'s regular check-up, the {visit_label}. At these
    visits we follow your child's growth and give vaccines that are due. These are the free times:
    {slot_options}. Which one suits you? If another day is better, I will find one. If you no longer
    want these reminders, just tell me and we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "huwag nang magtanong muli"
  text: >-
    Batiin si {recipient_first_name} at magpakilala bilang community health worker mula sa
    {clinic_name}. Ipaliwanag na panahon na para sa regular na check-up ni {child_first_name}
    ({visit_label}) at na sa mga pagbisitang ito ay tinitingnan ang paglaki at ibinibigay ang mga
    bakunang nakatakda na. Ialok ang mga oras na ito: {slot_options}. Tumulong sa mga tanong tungkol
    sa transportasyon. Kung ayaw nilang sumali, magpasalamat, itala ang "tumanggi" at huwag nang
    magtanong muli.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself as a community health worker from
    {clinic_name}. Explain that it is time for {child_first_name}'s regular check-up ({visit_label})
    and that these visits check growth and give vaccines that are due. Offer these times:
    {slot_options}. Help with transport questions. If they do not want to take part, thank them,
    record "declined" and do not ask again.

