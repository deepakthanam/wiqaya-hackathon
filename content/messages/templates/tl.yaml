    will stop these calls.
- id: IMM_PARENT_CHW
  pathway: immunisation
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "huwag nang magtanong muli"
