    Reply: 1=book 2=other time 3=STOP
- id: IMM_PARENT_CALL
  pathway: immunisation
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "sabihin lang po sa akin at ititigil na namin ang mga tawag na ito"
  text: >-
    Magandang araw po, maaari ko po bang makausap si {recipient_first_name}? Ako po si {caller_name}
