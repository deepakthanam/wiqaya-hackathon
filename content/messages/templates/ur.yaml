- id: DEV_PARENT_CHW
  pathway: developmental
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "دوبارہ نہ پوچھیں"
  text: >-
    {recipient_first_name} کو سلام کریں اور {clinic_name} کی طرف سے اپنا تعارف کرائیں۔ بتائیں کہ
    {child_first_name} کی عمر کے ہر بچے کا کھیل، بولنے اور چلنے پھرنے کا ایک چھوٹا سا معمول کا چیک ہوتا
    ہے، اور والدین کوئی بھی سوال پوچھ سکتے ہیں۔ یہ وقت پیش کریں: {slot_options}۔ اگر وہ حصہ نہیں لینا
