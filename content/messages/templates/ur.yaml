  english_gloss: >-
    Peace be upon you {recipient_first_name}, this is {clinic_name}. For every child of
    {child_first_name}'s age we do a short check of how they play, talk and move about. You can ask any
    question about your child's growth. Times kept for you: {slot_options}. Reply 1 to book, 2 for
    another time, and 3 if you do not want these reminders.
- id: DEV_PARENT_SMS
  pathway: developmental
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
