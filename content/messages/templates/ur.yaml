  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Explain that every child of
    {child_first_name}'s age has a short routine check of play, talking and movement, and parents can
    ask any question. Offer these times: {slot_options}. If they do not want to take part, thank them,
    record "declined" and do not ask again.

