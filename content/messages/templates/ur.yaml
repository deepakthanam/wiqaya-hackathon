    {clinic_name} سے بات کر رہا ہوں۔ ہمارے ریکارڈ کے مطابق {child_first_name} کا ایک معمول کا ٹیکہ
    باقی ہے۔ اگر یہ ٹیکہ کہیں اور لگ چکا ہے تو ہمیں بتائیں تاکہ ہم ریکارڈ ٹھیک کر لیں۔ ہمارے پاس یہ وقت
    ہیں: {slot_options}۔ آپ کے لیے کون سا وقت ٹھیک ہے؟ اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے تو مجھے
    بتا دیں اور ہم یہ کالز بند کر دیں گے۔
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name}, from {clinic_name}. Our
    record says {child_first_name} has one routine vaccine due. If it was given somewhere else, tell us
    so we can correct the record. We have these times: {slot_options}. Which time is good for you? If
    you do not want these reminders, tell me and we will stop these calls.
