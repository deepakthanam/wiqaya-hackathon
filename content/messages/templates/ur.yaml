    {child_first_name} کا ایک معمول کا ٹیکہ باقی ہے۔ اگر ان کے پاس ٹیکوں کا کارڈ ہو تو دیکھنے کے لیے
    مانگیں، اور کہیں اور لگے ٹیکے نوٹ کریں۔ یہ وقت پیش کریں: {slot_options}۔ اگر وہ حصہ نہیں لینا
    چاہتے تو ان کا شکریہ ادا کریں، "انکار" درج کریں اور دوبارہ نہ پوچھیں۔
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Explain that
    {child_first_name} has one routine vaccine due. Ask to see the vaccine card if they have one, and
    note vaccines given elsewhere. Offer these times: {slot_options}. If they do not want to take part,
    thank them, record "declined" and do not ask again.

