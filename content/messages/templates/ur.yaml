  text: >-
    {clinic_short}: {child_first_name} کا کھیل اور نشوونما کا چیک ہے۔ خالی وقت: {slot_short}۔ جواب دیں
    1=بکنگ 2=اور وقت 3=STOP
  english_gloss: >-
    {clinic_short}: {child_first_name} has a play and growth check. Free time: {slot_short}. Reply
    1=booking 2=other time 3=STOP
- id: DEV_PARENT_CALL
  pathway: developmental
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "مجھے بتا دیں اور ہم یہ کالز بند کر دیں گے"
  text: >-
    السلام علیکم، کیا میری بات {recipient_first_name} سے ہو سکتی ہے؟ میرا نام {caller_name} ہے، میں
    {clinic_name} سے بات کر رہا ہوں۔ ہم {child_first_name} کی عمر کے ہر بچے کا ایک چھوٹا سا چیک کرتے
    ہیں کہ وہ کیسے کھیلتا، بولتا اور چلتا پھرتا ہے۔ اس میں تقریباً 20 منٹ لگتے ہیں، اور آپ ڈاکٹر سے کوئی
    بھی سوال پوچھ سکتے ہیں۔ ہمارے پاس یہ وقت ہیں: {slot_options}۔ آپ کے لیے کون سا وقت ٹھیک ہے؟ اگر آپ
    یہ یاد دہانیاں نہیں لینا چاہتے تو مجھے بتا دیں اور ہم یہ کالز بند کر دیں گے۔
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name}, from {clinic_name}. For
    every child of {child_first_name}'s age we do a short check of how they play, talk and move. It
    takes about 20 minutes and you can ask the doctor any question. We have these times:
    {slot_options}. Which time is good for you? If you do not want these reminders, tell me and we will
