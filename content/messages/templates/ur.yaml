  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "مجھے بتا دیں اور ہم یہ کالز بند کر دیں گے"
  text: >-
    السلام علیکم، کیا میری بات {recipient_first_name} سے ہو سکتی ہے؟ میرا نام {caller_name} ہے، میں
    {clinic_name} سے بات کر رہا ہوں۔ آپ کے ڈاکٹر آپ کے خاندان کے لیے، {child_first_name} سمیت، دل کی
    صحت کے چیک کا مشورہ دیتے ہیں۔ یہ خون کا ایک آسان ٹیسٹ ہے، اور ڈاکٹر وزٹ پر اس کے بارے میں سمجھائیں
    گے۔ ہمارے پاس یہ وقت ہیں: {slot_options}۔ اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے تو مجھے بتا دیں اور
    ہم یہ کالز بند کر دیں گے۔
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name}, from {clinic_name}. Your
    doctor advises a heart-health check for your family, including {child_first_name}. It is a simple
    blood test, and the doctor will explain it at the visit. We have these times: {slot_options}. If
    you do not want these reminders, tell me and we will stop these calls.
- id: CASCADE_PARENT_CHW
  pathway: cascade_family
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "دوبارہ نہ پوچھیں"
  text: >-
    {recipient_first_name} کو سلام کریں اور {clinic_name} کی طرف سے اپنا تعارف کرائیں۔ صرف اتنا بتائیں
    کہ ان کے ڈاکٹر خاندان کے لیے، {child_first_name} سمیت، دل کی صحت کے چیک کا مشورہ دیتے ہیں۔ کسی اور
    شخص کی صحت پر کبھی بات نہ کریں۔ یہ وقت پیش کریں: {slot_options}۔ اگر وہ حصہ نہیں لینا چاہتے تو ان کا
    شکریہ ادا کریں، "انکار" درج کریں اور دوبارہ نہ پوچھیں۔
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Say only that their doctor
    advises a heart-health check for the family, including {child_first_name}. Never talk about any
    other person's health. Offer these times: {slot_options}. If they do not want to take part, thank
    them, record "declined" and do not ask again.

# ---------------------------------------------------------------- Confirmations
- id: PREF_CONFIRM_WHATSAPP
  pathway: preference_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name]
  decline_text: "STOP بھیجیں"
  text: >-
    شکریہ، {recipient_first_name}۔ ہم نے رابطے کے بارے میں آپ کی پسند محفوظ کر لی ہے۔ آپ اسے کسی بھی
    وقت بدل سکتے ہیں، یا تمام یاد دہانیاں بند کرنے کے لیے STOP بھیجیں۔
  english_gloss: >-
    Thank you, {recipient_first_name}. We have saved your contact preferences. You can change them at
    any time, or send STOP to stop all reminders.
- id: PREF_CONFIRM_SMS
  pathway: preference_confirm
  audience: adult
  channel: sms
  slots: [recipient_first_name]
  decline_text: "STOP"
  text: >-
    شکریہ {recipient_first_name}۔ آپ کی پسند محفوظ ہو گئی۔ تمام یاد دہانیاں بند کرنے کے لیے STOP
    بھیجیں۔
  english_gloss: >-
    Thank you {recipient_first_name}. Your preference is saved. Send STOP to stop all reminders.
- id: OPTOUT_CONFIRM_WHATSAPP
  pathway: optout_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, pathway_label]
  decline_text: "STOP بھیجیں"
  text: >-
    شکریہ، {recipient_first_name}۔ آپ کو {pathway_label} کے بارے میں مزید یاد دہانیاں نہیں آئیں گی۔
    اس سے آپ کے علاج پر کوئی فرق نہیں پڑے گا۔ اگر آپ کا ارادہ بدل جائے تو بس اپنے کلینک کو بتا دیں۔ تمام
    یاد دہانیاں بند کرنے کے لیے STOP بھیجیں۔
  english_gloss: >-
    Thank you, {recipient_first_name}. You will not get more reminders about {pathway_label}. This
    makes no difference to your care. If you change your mind, just tell your clinic. To stop all
    reminders, send STOP.
- id: OPTOUT_CONFIRM_SMS
  pathway: optout_confirm
  audience: adult
  channel: sms
  slots: [pathway_label]
  decline_text: "STOP"
  text: >-
    {pathway_label} کی یاد دہانیاں بند۔ آپ کا علاج نہیں بدلے گا۔ سب بند کرنے کے لیے STOP بھیجیں۔
  english_gloss: >-
    Reminders for {pathway_label} stopped. Your care will not change. Send STOP to stop all.
- id: LATER_CONFIRM_WHATSAPP
  pathway: remind_later_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, until_date]
  decline_text: "STOP بھیجیں"
  text: >-
    شکریہ، {recipient_first_name}۔ ہم آپ کو {until_date} کے بعد دوبارہ یاد دلائیں گے۔ تمام یاد دہانیاں
    بند کرنے کے لیے STOP بھیجیں۔
  english_gloss: >-
    Thank you, {recipient_first_name}. We will remind you again after {until_date}. To stop all
    reminders, send STOP.
- id: LATER_CONFIRM_SMS
  pathway: remind_later_confirm
  audience: adult
  channel: sms
  slots: [until_date]
  decline_text: "STOP"
  text: >-
    ٹھیک ہے، ہم {until_date} کے بعد یاد دلائیں گے۔ تمام یاد دہانیاں بند کرنے کے لیے STOP بھیجیں۔
  english_gloss: >-
    OK, we will remind you after {until_date}. Send STOP to stop all reminders.
