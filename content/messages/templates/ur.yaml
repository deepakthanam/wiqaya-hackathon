# Urdu templates: machine draft of templates/en.yaml. Needs native review before use.
# Simple everyday Urdu, polite "آپ" form. Reply codes (1/2/3, STOP) stay in ASCII.
language: ur
review_status: machine_draft
templates:

# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "3 اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے"
  text: >-
    السلام علیکم {recipient_first_name}، یہ {clinic_name} ہے۔ {child_first_name} کا معمول کا چیک اپ
    ({visit_label}) کا وقت آ گیا ہے۔ اس سے ہمیں پتہ چلتا ہے کہ آپ کا بچہ کیسے بڑھ رہا ہے۔ ہم نے آپ کے
    لیے یہ وقت رکھے ہیں: {slot_options}۔ جواب میں 1 بھیجیں بکنگ کے لیے، 2 کسی اور وقت کے لیے، اور
    3 اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے۔
  english_gloss: >-
    Peace be upon you {recipient_first_name}, this is {clinic_name}. It is time for {child_first_name}'s
    routine check-up ({visit_label}). It helps us know how your child is growing. We kept these times
    for you: {slot_options}. Reply 1 to book, 2 for another time, and 3 if you do not want these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name} کا معمول کا چیک اپ ہے۔ خالی وقت: {slot_short}۔ جواب دیں
    1=بکنگ 2=اور وقت 3=STOP
  english_gloss: >-
    {clinic_short}: {child_first_name} has a routine check-up. Free time: {slot_short}. Reply 1=booking
    2=other time 3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "مجھے بتا دیں اور ہم یہ کالز بند کر دیں گے"
  text: >-
    السلام علیکم، کیا میری بات {recipient_first_name} سے ہو سکتی ہے؟ میرا نام {caller_name} ہے، میں
    {clinic_name} سے بات کر رہا ہوں۔ یہ کال اس لیے ہے کہ {child_first_name} کا معمول کا چیک اپ،
    {visit_label}، کا وقت آ گیا ہے۔ اس چیک اپ میں ہم بچے کی نشوونما دیکھتے ہیں اور جو ٹیکے باقی ہوں وہ
    لگاتے ہیں۔ ہمارے پاس یہ وقت ہیں: {slot_options}۔ آپ کے لیے کون سا وقت ٹھیک ہے؟ اگر کوئی اور دن
    بہتر ہو تو ہم وہ بھی ڈھونڈ سکتے ہیں۔ اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے تو مجھے بتا دیں اور ہم
    یہ کالز بند کر دیں گے۔
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name}, I am speaking from
    {clinic_name}. This call is because it is time for {child_first_name}'s routine check-up,
    {visit_label}. In this check-up we look at the child's growth and give any vaccines still due. We
    have these times: {slot_options}. Which time is good for you? If another day is better we can find
    that too. If you do not want these reminders, tell me and we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "دوبارہ نہ پوچھیں"
  text: >-
    {recipient_first_name} کو سلام کریں اور بتائیں کہ آپ {clinic_name} کے کمیونٹی ہیلتھ ورکر ہیں۔
    بتائیں کہ {child_first_name} کا معمول کا چیک اپ ({visit_label}) کا وقت آ گیا ہے، اور اس چیک اپ میں
    بچے کی نشوونما دیکھی جاتی ہے اور باقی ٹیکے لگائے جاتے ہیں۔ یہ وقت پیش کریں: {slot_options}۔ آنے
    جانے کے سوالوں میں مدد کریں۔ اگر وہ حصہ نہیں لینا چاہتے تو ان کا شکریہ ادا کریں، "انکار" درج کریں
    اور دوبارہ نہ پوچھیں۔
  english_gloss: >-
    Greet {recipient_first_name} and say you are a community health worker from {clinic_name}. Explain
    that it is time for {child_first_name}'s routine check-up ({visit_label}), where the child's growth
    is checked and due vaccines are given. Offer these times: {slot_options}. Help with transport
    questions. If they do not want to take part, thank them, record "declined" and do not ask again.

# ---------------------------------------------------------------- Developmental check
- id: DEV_PARENT_WHATSAPP
  pathway: developmental
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "3 اگر آپ یہ یاد دہانیاں نہیں لینا چاہتے"
  text: >-
    السلام علیکم {recipient_first_name}، یہ {clinic_name} ہے۔ {child_first_name} کی عمر کے ہر بچے کا
    ہم ایک چھوٹا سا چیک کرتے ہیں کہ وہ کیسے کھیلتا، بولتا اور چلتا پھرتا ہے۔ آپ بچے کی نشوونما کے بارے
