    ഞങ്ങളുടെ പക്കൽ ഈ സമയങ്ങളുണ്ട്: {slot_options}. ഏതാണ് സൗകര്യം? ഈ ഓർമ്മപ്പെടുത്തലുകൾ
    വേണ്ടെങ്കിൽ എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ ഈ കോളുകൾ നിർത്താം.
  english_gloss: >-
