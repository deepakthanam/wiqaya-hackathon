    നമസ്കാരം, {recipient_first_name} ആണോ സംസാരിക്കുന്നത്? ഞാൻ {caller_name}, {clinic_name}-ൽ
    നിന്നാണ്. നിങ്ങളുടെ കുടുംബത്തിന് ഒരു ഹൃദയാരോഗ്യ പരിശോധന ഡോക്ടർ നിർദ്ദേശിക്കുന്നു. ഇത് ഒരു
    ലളിതമായ രക്തപരിശോധനയാണ്. മറ്റാരുടെയും ആരോഗ്യ വിവരങ്ങൾ എനിക്ക് പങ്കുവെക്കാൻ കഴിയില്ല, പക്ഷേ
    നിങ്ങളുടെ സ്വന്തം ചോദ്യങ്ങൾക്ക് സന്ദർശന സമയത്ത് ഡോക്ടർ മറുപടി തരും. ഞങ്ങളുടെ പക്കൽ ഈ
    സമയങ്ങളുണ്ട്: {slot_options}. ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ
    ഈ കോളുകൾ നിർത്താം.
  english_gloss: >-
