# Malayalam templates. Machine draft of templates/en.yaml; needs native review before use.
# Simple everyday Malayalam for Keralite workers in the Gulf. Never name a condition.
language: ml
review_status: machine_draft
templates:

# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3"
  text: >-
    നമസ്കാരം {recipient_first_name}, ഇത് {clinic_name} ആണ്. {child_first_name}-ന്റെ പതിവ്
    ചെക്കപ്പിന് ({visit_label}) സമയമായി. കുട്ടിയുടെ വളർച്ച നോക്കാൻ ഈ സന്ദർശനങ്ങൾ സഹായിക്കും.
    നിങ്ങൾക്കായി മാറ്റിവെച്ച സമയങ്ങൾ: {slot_options}. ബുക്ക് ചെയ്യാൻ 1, വേറെ സമയത്തിന് 2,
    ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3 എന്ന് മറുപടി അയക്കുക.
  english_gloss: >-
    Hello {recipient_first_name}, this is {clinic_name}. It is time for {child_first_name}'s routine
    check-up ({visit_label}). These visits help to see the child's growth. Times kept for you:
    {slot_options}. Reply 1 to book, 2 for another time, 3 if you do not want these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name}-ന് പതിവ് ചെക്കപ്പ്. സമയം: {slot_short}. 1=ബുക്ക് 2=വേറെ
    സമയം 3=STOP
  english_gloss: >-
    {clinic_short}: routine check-up for {child_first_name}. Time: {slot_short}. 1=book 2=other time
    3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ ഈ കോളുകൾ നിർത്താം"
  text: >-
    നമസ്കാരം, {recipient_first_name} ആണോ സംസാരിക്കുന്നത്? എന്റെ പേര് {caller_name}, {clinic_name}-ൽ
    നിന്നാണ് വിളിക്കുന്നത്. {child_first_name}-ന്റെ പതിവ് ചെക്കപ്പിന്, അതായത് {visit_label}-ന്,
    സമയമായതുകൊണ്ടാണ് വിളിക്കുന്നത്. ഈ സന്ദർശനങ്ങളിൽ കുട്ടിയുടെ വളർച്ച നോക്കുകയും എടുക്കേണ്ട
    കുത്തിവെപ്പുകൾ നൽകുകയും ചെയ്യും. ഞങ്ങളുടെ പക്കൽ ഈ സമയങ്ങളുണ്ട്: {slot_options}. ഏതാണ്
    സൗകര്യം? വേറെ ദിവസമാണ് നല്ലതെങ്കിൽ ഞാൻ കണ്ടെത്തിത്തരാം. ഈ ഓർമ്മപ്പെടുത്തലുകൾ
    വേണ്ടെങ്കിൽ എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ ഈ കോളുകൾ നിർത്താം.
  english_gloss: >-
    Hello, is this {recipient_first_name}? My name is {caller_name}, calling from {clinic_name}. I
    am calling because it is time for {child_first_name}'s routine check-up, the {visit_label}. In
    these visits we check the child's growth and give vaccines that are due. We have these times:
    {slot_options}. Which suits you? If another day is better I can find one. If you do not want
    these reminders, just tell me and we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "വീണ്ടും ചോദിക്കരുത്"
  text: >-
    {recipient_first_name}-നെ അഭിവാദ്യം ചെയ്യുക, {clinic_name}-ൽ നിന്നുള്ള കമ്മ്യൂണിറ്റി ഹെൽത്ത്
    വർക്കർ ആണെന്ന് പരിചയപ്പെടുത്തുക. {child_first_name}-ന്റെ പതിവ് ചെക്കപ്പിന് ({visit_label})
    സമയമായെന്നും, ഈ സന്ദർശനങ്ങളിൽ വളർച്ച നോക്കുകയും എടുക്കേണ്ട കുത്തിവെപ്പുകൾ നൽകുകയും
    ചെയ്യുമെന്നും പറയുക. ഈ സമയങ്ങൾ നൽകുക: {slot_options}. യാത്രയെക്കുറിച്ചുള്ള ചോദ്യങ്ങളിൽ
    സഹായിക്കുക. പങ്കെടുക്കാൻ താൽപ്പര്യമില്ലെങ്കിൽ നന്ദി പറയുക, "declined" എന്ന് രേഖപ്പെടുത്തുക,
    വീണ്ടും ചോദിക്കരുത്.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself as a community health worker from
    {clinic_name}. Say it is time for {child_first_name}'s routine check-up ({visit_label}) and that
    these visits check growth and give due vaccines. Offer these times: {slot_options}. Help with
    travel questions. If they do not wish to take part, thank them, record "declined", do not ask
    again.

# ---------------------------------------------------------------- Developmental check
- id: DEV_PARENT_WHATSAPP
  pathway: developmental
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3"
  text: >-
    നമസ്കാരം {recipient_first_name}, ഇത് {clinic_name} ആണ്. {child_first_name}-ന്റെ പ്രായത്തിലുള്ള
    എല്ലാ കുട്ടികൾക്കും കളി, സംസാരം, ചലനം എന്നിവ നോക്കുന്ന ഒരു ചെറിയ പരിശോധന ഞങ്ങൾ നൽകുന്നു.
    കുട്ടിയുടെ വളർച്ചയെക്കുറിച്ച് എന്തും ചോദിക്കാം. നിങ്ങൾക്കായി മാറ്റിവെച്ച സമയങ്ങൾ:
    {slot_options}. ബുക്ക് ചെയ്യാൻ 1, വേറെ സമയത്തിന് 2, ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3 എന്ന്
    മറുപടി അയക്കുക.
  english_gloss: >-
    Hello {recipient_first_name}, this is {clinic_name}. We offer all children of
    {child_first_name}'s age a short check of play, talking and movement. You can ask anything about
    your child's growth. Times kept for you: {slot_options}. Reply 1 to book, 2 for another time, 3
    if you do not want these reminders.
- id: DEV_PARENT_SMS
  pathway: developmental
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name}-ന് കളി-വളർച്ച പരിശോധന. സമയം: {slot_short}. 1=ബുക്ക്
    2=വേറെ സമയം 3=STOP
  english_gloss: >-
    {clinic_short}: play-and-growth check for {child_first_name}. Time: {slot_short}. 1=book
    2=other time 3=STOP
- id: DEV_PARENT_CALL
  pathway: developmental
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ ഈ കോളുകൾ നിർത്താം"
  text: >-
    നമസ്കാരം, {recipient_first_name} ആണോ സംസാരിക്കുന്നത്? ഞാൻ {caller_name}, {clinic_name}-ൽ
    നിന്നാണ്. {child_first_name}-ന്റെ പ്രായത്തിലുള്ള എല്ലാ കുട്ടികൾക്കും കളി, സംസാരം, ചലനം എന്നിവ
    നോക്കുന്ന ഒരു ചെറിയ പരിശോധന ഞങ്ങൾ നൽകുന്നു. ഏകദേശം 20 മിനിറ്റ് എടുക്കും, ഡോക്ടറോട് എന്തും
    ചോദിക്കാം. ഞങ്ങളുടെ പക്കൽ ഈ സമയങ്ങളുണ്ട്: {slot_options}. ഏതാണ് സൗകര്യം? ഈ
    ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ എന്നോട് പറഞ്ഞാൽ മതി, ഞങ്ങൾ ഈ കോളുകൾ നിർത്താം.
  english_gloss: >-
    Hello, is this {recipient_first_name}? I am {caller_name} from {clinic_name}. We offer all
    children of {child_first_name}'s age a short check of play, talking and movement. It takes about
    20 minutes and you can ask the doctor anything. We have these times: {slot_options}. Which
    suits you? If you do not want these reminders, just tell me and we will stop these calls.
- id: DEV_PARENT_CHW
  pathway: developmental
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "വീണ്ടും ചോദിക്കരുത്"
  text: >-
    {recipient_first_name}-നെ അഭിവാദ്യം ചെയ്യുക, {clinic_name}-ൽ നിന്നാണെന്ന് പരിചയപ്പെടുത്തുക.
    {child_first_name}-ന്റെ പ്രായത്തിലുള്ള എല്ലാ കുട്ടികൾക്കും കളി, സംസാരം, ചലനം എന്നിവ നോക്കുന്ന
    ഒരു ചെറിയ പതിവ് പരിശോധന ഉണ്ടെന്നും, മാതാപിതാക്കൾക്ക് എന്തും ചോദിക്കാമെന്നും പറയുക. ഈ
    സമയങ്ങൾ നൽകുക: {slot_options}. പങ്കെടുക്കാൻ താൽപ്പര്യമില്ലെങ്കിൽ നന്ദി പറയുക, "declined"
    എന്ന് രേഖപ്പെടുത്തുക, വീണ്ടും ചോദിക്കരുത്.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Say that all children of
    {child_first_name}'s age have a short routine check of play, talking and movement, and parents
    can ask anything. Offer these times: {slot_options}. If they do not wish to take part, thank
    them, record "declined", do not ask again.

# ---------------------------------------------------------------- Immunisation catch-up
- id: IMM_PARENT_WHATSAPP
  pathway: immunisation
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, clinic_name, slot_options]
  decline_text: "ഈ ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3"
  text: >-
    നമസ്കാരം {recipient_first_name}, ഇത് {clinic_name} ആണ്. ഞങ്ങളുടെ രേഖ പ്രകാരം
    {child_first_name}-ന് ഒരു പതിവ് കുത്തിവെപ്പ് എടുക്കാൻ സമയമായി. കുത്തിവെപ്പുകൾ കുട്ടികളെ
    സംരക്ഷിക്കുന്നു. നിങ്ങൾക്കായി മാറ്റിവെച്ച സമയങ്ങൾ: {slot_options}. ഞങ്ങളുടെ രേഖ ശരിയല്ലെന്ന്
    തോന്നുന്നെങ്കിൽ ദയവായി അറിയിക്കുക. ബുക്ക് ചെയ്യാൻ 1, വേറെ സമയത്തിന് 2, ഈ
    ഓർമ്മപ്പെടുത്തലുകൾ വേണ്ടെങ്കിൽ 3 എന്ന് മറുപടി അയക്കുക.
  english_gloss: >-
    Hello {recipient_first_name}, this is {clinic_name}. Our record says {child_first_name} is due a
    routine vaccine. Vaccines protect children. Times kept for you: {slot_options}. If you think our
    record is not right, please tell us. Reply 1 to book, 2 for another time, 3 if you do not want
    these reminders.
- id: IMM_PARENT_SMS
  pathway: immunisation
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name}-ന് പതിവ് കുത്തിവെപ്പ്. സമയം: {slot_short}. 1=ബുക്ക് 2=വേറെ
    സമയം 3=STOP
