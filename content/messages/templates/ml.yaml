    {child_first_name}-ന് ഒരു പതിവ് കുത്തിവെപ്പ് എടുക്കാൻ സമയമായെന്ന് പറയുക. വാക്സിൻ കാർഡ്
    ഉണ്ടെങ്കിൽ കാണിക്കാൻ ചോദിക്കുക, വേറെ എവിടെയെങ്കിലും എടുത്ത കുത്തിവെപ്പുകൾ രേഖപ്പെടുത്തുക. ഈ
    സമയങ്ങൾ നൽകുക: {slot_options}. പങ്കെടുക്കാൻ താൽപ്പര്യമില്ലെങ്കിൽ നന്ദി പറയുക, "declined"
    എന്ന് രേഖപ്പെടുത്തുക, വീണ്ടും ചോദിക്കരുത്.
  english_gloss: >-
    Greet {recipient_first_name} and introduce yourself from {clinic_name}. Say {child_first_name} is
    due a routine vaccine. Ask to see the vaccine card if they have one, and note vaccines given
    elsewhere. Offer these times: {slot_options}. If they do not wish to take part, thank them,
    record "declined", do not ask again.

# ---------------------------------------------------------------- Child growth follow-up
- id: GROWTH_PARENT_WHATSAPP
  pathway: child_growth_followup
  audience: parent
