# ---------------------------------------------------------------- Confirmations
- id: PREF_CONFIRM_WHATSAPP
  pathway: preference_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name]
  decline_text: "STOP എന്ന് മറുപടി അയക്കുക"
  text: >-
    നന്ദി, {recipient_first_name}. നിങ്ങളുടെ ബന്ധപ്പെടൽ മുൻഗണനകൾ ഞങ്ങൾ സേവ് ചെയ്തു. എപ്പോൾ
    വേണമെങ്കിലും ഇവ മാറ്റാം. എല്ലാ ഓർമ്മപ്പെടുത്തലുകളും നിർത്താൻ STOP എന്ന് മറുപടി അയക്കുക.
  english_gloss: >-
    Thank you, {recipient_first_name}. We have saved your contact preferences. You can change them
    at any time. To stop all reminders, reply STOP.
- id: PREF_CONFIRM_SMS
  pathway: preference_confirm
  audience: adult
  channel: sms
  slots: [recipient_first_name]
  decline_text: "STOP"
  text: >-
    നന്ദി {recipient_first_name}. നിങ്ങളുടെ മുൻഗണനകൾ സേവ് ചെയ്തു. എല്ലാം നിർത്താൻ STOP അയക്കുക.
  english_gloss: >-
    Thank you {recipient_first_name}. Your preferences are saved. To stop everything, send STOP.
- id: OPTOUT_CONFIRM_WHATSAPP
  pathway: optout_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, pathway_label]
  decline_text: "STOP എന്ന് മറുപടി അയക്കുക"
  text: >-
    നന്ദി, {recipient_first_name}. {pathway_label}-നെക്കുറിച്ച് ഇനി ഓർമ്മപ്പെടുത്തലുകൾ വരില്ല.
    ഇത് നിങ്ങളുടെ ചികിത്സയെ ബാധിക്കില്ല. മനസ്സ് മാറിയാൽ ക്ലിനിക്കിനോട് പറഞ്ഞാൽ മതി. എല്ലാ
    ഓർമ്മപ്പെടുത്തലുകളും നിർത്താൻ STOP എന്ന് മറുപടി അയക്കുക.
  english_gloss: >-
    Thank you, {recipient_first_name}. You will not get more reminders about {pathway_label}. This
    does not affect your care. If you change your mind, just tell the clinic. To stop all reminders,
    reply STOP.
- id: OPTOUT_CONFIRM_SMS
  pathway: optout_confirm
  audience: adult
  channel: sms
  slots: [pathway_label]
  decline_text: "STOP"
  text: >-
    {pathway_label}: ഇനി ഓർമ്മപ്പെടുത്തൽ ഇല്ല. ചികിത്സ മാറില്ല. എല്ലാം നിർത്താൻ STOP അയക്കുക.
  english_gloss: >-
    {pathway_label}: no more reminders. Your care does not change. To stop everything, send STOP.
- id: LATER_CONFIRM_WHATSAPP
  pathway: remind_later_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, until_date]
  decline_text: "STOP എന്ന് മറുപടി അയക്കുക"
  text: >-
    നന്ദി, {recipient_first_name}. {until_date}-ന് ശേഷം ഞങ്ങൾ വീണ്ടും ഓർമ്മിപ്പിക്കാം. എല്ലാ
    ഓർമ്മപ്പെടുത്തലുകളും നിർത്താൻ STOP എന്ന് മറുപടി അയക്കുക.
  english_gloss: >-
    Thank you, {recipient_first_name}. We will remind you again after {until_date}. To stop all
    reminders, reply STOP.
- id: LATER_CONFIRM_SMS
  pathway: remind_later_confirm
  audience: adult
  channel: sms
  slots: [until_date]
  decline_text: "STOP"
  text: >-
    ശരി, {until_date}-ന് ശേഷം വീണ്ടും ഓർമ്മിപ്പിക്കാം. എല്ലാം നിർത്താൻ STOP അയക്കുക.
  english_gloss: >-
    OK, we will remind you again after {until_date}. To stop everything, send STOP.
