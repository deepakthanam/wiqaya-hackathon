# ---------------------------------------------------------------- Confirmations
- id: PREF_CONFIRM_WHATSAPP
  pathway: preference_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name]
  decline_text: "reply STOP"
  text: >-
    Thank you, {recipient_first_name}. We have saved your contact preferences. You can change them
    at any time, or reply STOP to stop all reminders.
- id: PREF_CONFIRM_SMS
  pathway: preference_confirm
  audience: adult
  channel: sms
  slots: [recipient_first_name]
  decline_text: "STOP"
  text: >-
    Thank you {recipient_first_name}. Your contact preferences are saved. Reply STOP to stop all
    reminders.
- id: OPTOUT_CONFIRM_WHATSAPP
  pathway: optout_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, pathway_label]
  decline_text: "reply STOP"
  text: >-
    Thank you, {recipient_first_name}. You will not get more reminders about {pathway_label}. This
    does not change your care. If you change your mind, just tell your clinic. To stop all
    reminders, reply STOP.
- id: OPTOUT_CONFIRM_SMS
  pathway: optout_confirm
  audience: adult
  channel: sms
  slots: [pathway_label]
  decline_text: "STOP"
  text: >-
    You will not get more reminders about {pathway_label}. Your care does not change. Reply STOP to
    stop all reminders.
- id: LATER_CONFIRM_WHATSAPP
  pathway: remind_later_confirm
  audience: adult
  channel: whatsapp
  slots: [recipient_first_name, until_date]
  decline_text: "reply STOP"
  text: >-
    Thank you, {recipient_first_name}. We will remind you again after {until_date}. To stop all
    reminders, reply STOP.
- id: LATER_CONFIRM_SMS
  pathway: remind_later_confirm
  audience: adult
  channel: sms
  slots: [until_date]
  decline_text: "STOP"
  text: >-
    OK, we will remind you after {until_date}. Reply STOP to stop all reminders.
