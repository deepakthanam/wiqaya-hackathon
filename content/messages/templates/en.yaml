# English source templates (human-written). Other languages are machine drafts of these.
# Plain language (about 6th-grade level), calm and respectful. Never name a condition.
# `decline_text` must appear in `text`: every message offers a way to say no.
language: en
review_status: source
templates:

# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "3 if you prefer not to receive these reminders"
  text: >-
    Hello {recipient_first_name}, this is {clinic_name}. {child_first_name} is due for a routine
    check-up ({visit_label}). These visits help us follow how your child is growing. We have kept
    times for you: {slot_options}. Reply 1 to book, 2 for another time, 3 if you prefer not to
    receive these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name} is due a routine child check-up. Free time: {slot_short}.
    Reply 1=book 2=other time 3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "tell me and we will stop these calls"
  text: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name} from {clinic_name}.
    I am calling because {child_first_name} is due for a routine check-up, the {visit_label}.
    These visits help us follow your child's growth and give any vaccines that are due. We have
    these times: {slot_options}. Which one suits you? If another day is better, I can find one.
    If you prefer not to get these reminders, tell me and we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "do not ask again"
  text: >-
    Greet {recipient_first_name} and introduce yourself as a community health worker from
    {clinic_name}. Explain that {child_first_name} is due for a routine check-up ({visit_label})
    and that these visits check growth and give vaccines that are due. Offer these times:
    {slot_options}. Help with transport questions. If they prefer not to take part, thank them,
    record "declined" and do not ask again.

