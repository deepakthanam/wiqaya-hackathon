  audience: adult
  channel: chw_script
  slots: [recipient_first_name, clinic_name, slot_options]
  decline_text: "do not ask again"
  text: >-
    Speak with {recipient_first_name} in private, ideally as a female health worker. Introduce
    yourself from {clinic_name}. Explain that routine breast screening (mammogram) is offered to
    women of her age and is done by female staff. Offer these times: {slot_options}. If she prefers
    not to take part, thank her, record "declined" and do not ask again.

