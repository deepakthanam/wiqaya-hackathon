  pathway: mobile_van
  audience: adult
  channel: call_script
  slots: [caller_name, recipient_first_name, van_location, van_date, pathway_label]
  decline_text: "tell me and we will stop these calls"
  text: >-
    Hello, may I speak with {recipient_first_name}? I am {caller_name} from the community health
