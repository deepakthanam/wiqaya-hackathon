# ---------------------------------------------------------------- Well-Child Visit
- id: WCV_PARENT_WHATSAPP
  pathway: wcv
  audience: parent
  channel: whatsapp
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "3 अगर आप ये रिमाइंडर नहीं चाहते"
  text: >-
    नमस्ते {recipient_first_name}, यह {clinic_name} की ओर से संदेश है। {child_first_name} का नियमित
    चेक-अप ({visit_label}) का समय आ गया है। इन विज़िट से हम देख पाते हैं कि आपका बच्चा कैसे बढ़ रहा है।
    हमने आपके लिए ये समय रखे हैं: {slot_options}। जवाब दें: बुक करने के लिए 1, दूसरे समय के लिए 2,
    या 3 अगर आप ये रिमाइंडर नहीं चाहते।
  english_gloss: >-
    Hello {recipient_first_name}, this message is from {clinic_name}. It is time for {child_first_name}'s
    routine check-up ({visit_label}). These visits let us see how your child is growing. We kept these
    times for you: {slot_options}. Reply: 1 to book, 2 for another time, or 3 if you do not want these reminders.
- id: WCV_PARENT_SMS
  pathway: wcv
  audience: parent
  channel: sms
  slots: [child_first_name, clinic_short, slot_short]
  decline_text: "3=STOP"
  text: >-
    {clinic_short}: {child_first_name} का नियमित चेक-अप है। समय: {slot_short}। 1=बुक 2=दूसरा समय 3=STOP
  english_gloss: >-
    {clinic_short}: {child_first_name} has a routine check-up. Time: {slot_short}. 1=book 2=other time 3=STOP
- id: WCV_PARENT_CALL
  pathway: wcv
  audience: parent
  channel: call_script
  slots: [caller_name, recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "मुझे बता दीजिए, हम ये कॉल बंद कर देंगे"
  text: >-
    नमस्ते, क्या मेरी बात {recipient_first_name} से हो सकती है? मेरा नाम {caller_name} है, मैं
    {clinic_name} से बात कर रहा/रही हूँ। मैं इसलिए फ़ोन कर रहा/रही हूँ क्योंकि {child_first_name} का
    नियमित चेक-अप, यानी {visit_label}, होना है। इन विज़िट में हम बच्चे के बढ़ने पर नज़र रखते हैं और जो
    टीके बाकी हों वे लगाते हैं। हमारे पास ये समय हैं: {slot_options}। आपको कौन-सा समय ठीक लगेगा? अगर
    कोई और दिन बेहतर हो, तो मैं वह ढूंढ सकता/सकती हूँ। अगर आप ये रिमाइंडर नहीं चाहते, तो मुझे बता
    दीजिए, हम ये कॉल बंद कर देंगे।
  english_gloss: >-
    Hello, may I speak with {recipient_first_name}? My name is {caller_name}, I am speaking from
    {clinic_name}. I am calling because {child_first_name} has a routine check-up due, the {visit_label}.
    In these visits we watch the child's growth and give any vaccines still due. We have these times:
    {slot_options}. Which time suits you? If another day is better, I can find one. If you do not want
    these reminders, just tell me, we will stop these calls.
- id: WCV_PARENT_CHW
  pathway: wcv
  audience: parent
  channel: chw_script
  slots: [recipient_first_name, child_first_name, visit_label, clinic_name, slot_options]
  decline_text: "दोबारा न पूछें"
  text: >-
    {recipient_first_name} को नमस्ते कहें और बताएं कि आप {clinic_name} से सामुदायिक स्वास्थ्य
    कार्यकर्ता हैं। समझाएं कि {child_first_name} का नियमित चेक-अप ({visit_label}) होना है, और इन
    विज़िट में बच्चे का विकास देखा जाता है और बाकी टीके लगाए जाते हैं। ये समय बताएं: {slot_options}।
    आने-जाने से जुड़े सवालों में मदद करें। अगर वे हिस्सा नहीं लेना चाहते, तो उन्हें धन्यवाद दें, "मना
    किया" दर्ज करें और दोबारा न पूछें।
  english_gloss: >-
    Greet {recipient_first_name} and say you are a community health worker from {clinic_name}. Explain
    that {child_first_name} has a routine check-up ({visit_label}) due, and these visits check growth
    and give remaining vaccines. Offer these times: {slot_options}. Help with travel questions. If they
    do not want to take part, thank them, record "declined" and do not ask again.

