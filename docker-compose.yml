# Wiqaya local stack.
# `make up` starts only the FHIR store (hapi-db + hapi). The api and web services sit behind the
# "app" profile until Milestones 6 and 7 (`docker compose --profile app up`).

name: wiqaya

services:
  hapi-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HAPI_DB_NAME:-hapi}
      POSTGRES_USER: ${HAPI_DB_USER:-hapi}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:-hapi_local_only}
    volumes:
      - hapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  hapi:
    image: hapiproject/hapi:${HAPI_IMAGE_TAG:-v8.12.0-2}
    restart: unless-stopped
    depends_on:
      hapi-db:
        condition: service_healthy
    environment:
      spring.datasource.url: jdbc:postgresql://hapi-db:5432/${HAPI_DB_NAME:-hapi}
      spring.datasource.username: ${HAPI_DB_USER:-hapi}
      spring.datasource.password: ${HAPI_DB_PASSWORD:-hapi_local_only}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R4
      # Allow client-assigned ids such as "demo-001".
      hapi.fhir.client_id_strategy: ANY
      JAVA_TOOL_OPTIONS: ${HAPI_JAVA_OPTS:--Xms512m -Xmx2g}
    # Bound to localhost only. In deployment (M8) HAPI is not published at all.
    ports:
      - "127.0.0.1:${HAPI_PORT:-8080}:8080"
    networks: [internal]

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: [.env]
    environment:
      FHIR_BASE_URL: http://hapi:8080/fhir
    depends_on: [hapi]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    networks: [internal]

  web:
    profiles: [app]
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [internal]

volumes:
  hapi-db-data:

networks:
  internal:
