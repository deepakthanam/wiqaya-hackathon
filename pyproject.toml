[project]
name = "wiqaya"
version = "0.1.0"
description = "Wiqaya: precision prevention and screening prototype (synthetic data only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary – hackathon prototype" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.0",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.45",
  "ortools>=9.10",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "typer>=0.12",
  "rich>=13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
wiqaya = "wiqaya.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiqaya"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM102", "RUF046", "B007", "B023", "RUF028", "SIM108"]  # Arabic text; style nits

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["wiqaya"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wiqaya.rules.*", "wiqaya.governance.*", "wiqaya.api.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (20k cohort runs)",
  "integration: needs running services (HAPI)",
]
addopts = "-m 'not slow and not integration'"
